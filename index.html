<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>A Little Message</title>
<style>
*{box-sizing:border-box}
body{
  margin:0;min-height:100vh;background:white;
  font-family:Georgia,serif;display:flex;justify-content:center;
  align-items:center;overflow:hidden;color:#333
}
.container{width:min(650px,85%);text-align:center;padding:45px;z-index:2}
h1{font-size:32px;font-weight:normal;color:#d47796;margin-bottom:10px}
.subtitle{color:#999;font-size:15px;margin-bottom:25px}
textarea{
  width:100%;height:280px;resize:none;border:1px solid #f0cbd7;
  border-radius:15px;padding:22px;font-family:Georgia,serif;
  font-size:17px;line-height:1.7;color:#444;background:#fffafa;
  outline:none;box-shadow:0 5px 25px rgba(210,120,150,.08)
}
textarea:focus{border-color:#df91aa;box-shadow:0 5px 30px rgba(210,120,150,.15)}
button{
  margin-top:18px;padding:11px 28px;border:none;border-radius:25px;
  background:#e59ab1;color:white;font-size:15px;cursor:pointer;transition:.2s
}
button:hover{background:#d9819d;transform:translateY(-2px)}
.flowers{position:fixed;font-size:30px;line-height:1.5;opacity:.75;pointer-events:none}
.left{left:20px;top:12%;transform:rotate(-12deg)}
.right{right:20px;bottom:12%;transform:rotate(12deg)}
.flower{display:block;margin:12px}
@media(max-width:600px){
 .container{padding:25px} h1{font-size:27px}
 textarea{height:230px}.flowers{font-size:22px}
}
</style>
</head>
<body>
<div class="flowers left"><span class="flower">🌸</span><span class="flower">🌷</span><span class="flower">🌸</span></div>
<div class="container">
<h1>A Little Message</h1>
<div class="subtitle">Write whatever your heart wants to say.</div>
<textarea id="message" placeholder="Write your message here..."></textarea>
<br>
<button onclick="saveMessage()">Save Message</button>
</div>
<div class="flowers right"><span class="flower">🌷</span><span class="flower">🌸</span><span class="flower">🌷</span></div>
<script>
function saveMessage(){
 const message=document.getElementById("message").value;
 if(message.trim()===""){alert("Write something first!");return;}
 localStorage.setItem("myMessage",message);
 alert("Your message has been saved!");
}
window.onload=function(){
 const savedMessage=localStorage.getItem("myMessage");
 if(savedMessage) document.getElementById("message").value=savedMessage;
};
</script>
</body>
</html>
